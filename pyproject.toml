[project]
name = "midibakery-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["midibakery"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
package = [
    "pyinstaller>=6.22.3",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core"]

[tool.uv.sources]
midibakery = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
