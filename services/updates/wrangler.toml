# MidiBakery's update service. Deployed by .github/workflows/release.yml (job "worker") with the
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets; see services/updates/README.md.
name = "midibakery-updates"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false

routes = [
  { pattern = "updates.klirrwerk.com", custom_domain = true },
]

[[r2_buckets]]
binding = "RELEASES"
bucket_name = "midibakery-releases"

# Licensing (src/licenses.js). The database exists (Western Europe, migrations applied up to 0001).
# Until the Worker has the secret LICENSE_SIGNING_KEY (npx wrangler secret put LICENSE_SIGNING_KEY, the line
# keygen.py --license wrote) the license endpoints answer 503; the app's licensing stays off until
# LICENSE_KEYS in packages/core/src/midibakery/license.py has the public key.
# New migrations: npx wrangler d1 migrations apply midibakery --remote
[[d1_databases]]
binding = "DB"
database_name = "midibakery"
database_id = "f3a64052-9a56-4555-a7ee-fd44a76474e2"
migrations_dir = "migrations"

[vars]
# {"<key id>": "<base64 public key>"}: the license keys whose tokens may download updates
LICENSE_PUBLIC_KEYS = '{"ml-8c3da20a0e38": "HYYxRvxb/OPb18athQy/YojPCzQiAweQbuO6OREzFng="}'
# "1" once licenses are sold: installers only for tokens whose updates include the release
REQUIRE_LICENSE_FOR_UPDATES = "0"
