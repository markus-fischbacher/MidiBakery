# MidiBakery's update service. Deployed by .github/workflows/release.yml (job "worker") with the
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets; see services/updates/README.md.
name = "midibakery-updates"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false

routes = [
  { pattern = "updates.klirrwerk.com", custom_domain = true },
]

[[r2_buckets]]
binding = "RELEASES"
bucket_name = "midibakery-releases"

# Licensing (src/licenses.js). Until it is set up the license endpoints answer 503 and the app's
# licensing stays off (LICENSE_KEYS in packages/core/src/midibakery/license.py is empty).
# 1. npx wrangler d1 create midibakery  -> put its database_id below and uncomment the block
# 2. npx wrangler d1 migrations apply midibakery --remote
# 3. npx wrangler secret put LICENSE_SIGNING_KEY  (the line keygen.py --license printed for it)
# [[d1_databases]]
# binding = "DB"
# database_name = "midibakery"
# database_id = "<from wrangler d1 create>"
# migrations_dir = "migrations"

[vars]
# {"<key id>": "<base64 public key>"}: the license keys whose tokens may download updates
LICENSE_PUBLIC_KEYS = "{}"
# "1" once licenses are sold: installers only for tokens whose updates include the release
REQUIRE_LICENSE_FOR_UPDATES = "0"
