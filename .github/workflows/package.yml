name: Package

# The packaged app (PyInstaller) for macOS and Windows, smoke-tested on the system it was built for.
# The macOS installer (.pkg) is built and installed here too. Signing comes in D4e, Windows' installer in D4d.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]  # macos-latest is Apple silicon
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --group package

      - name: Build the app
        run: uv run python packaging/build_app.py

      # Version, install/uninstall from the app's own payload, the API and the MCP server.
      - name: Smoke test
        run: uv run python packaging/smoke.py build/app/midibakery

      # The installer as a user runs it: for the current user, no administrator; then the app's uninstall.
      - name: macOS installer
        if: runner.os == 'macOS'
        run: |
          uv run python packaging/macos/build_pkg.py
          installer -pkg build/app/MidiBakery-*-macos-*.pkg -target CurrentUserHomeDirectory
          uv run python packaging/macos/check_pkg.py

      - uses: actions/upload-artifact@v7
        with:
          name: midibakery-${{ matrix.os }}
          path: |
            build/app/MidiBakery-*.zip
            build/app/MidiBakery-*.pkg
          if-no-files-found: error
          retention-days: 14
