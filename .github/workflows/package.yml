name: Package

# The packaged app (PyInstaller) for macOS and Windows, smoke-tested on the system it was built for.
# The installers (macOS .pkg, Windows setup) are built and installed here too. Signing comes in D4e.
# Intel Macs get their own build on release tags and on PRs labelled "intel" (macOS minutes are dear;
# GitHub's Intel runners are expected to go in 2027, and with them this build).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon; macos-15-intel builds MidiBakery-<version>-macos-x64.pkg
        os: ${{ (startsWith(github.ref, 'refs/tags/v') || contains(github.event.pull_request.labels.*.name, 'intel'))
          && fromJSON('["macos-latest", "windows-latest", "macos-15-intel"]')
          || fromJSON('["macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --group package

      - name: Build the app
        run: uv run python packaging/build_app.py

      # Version, install/uninstall from the app's own payload, the API and the MCP server.
      - name: Smoke test
        run: uv run python packaging/smoke.py build/app/midibakery

      # The installer as a user runs it: for the current user, no administrator; then the app's uninstall.
      - name: macOS installer
        if: runner.os == 'macOS'
        run: |
          uv run python packaging/macos/build_pkg.py
          installer -pkg build/app/MidiBakery-*-macos-*.pkg -target CurrentUserHomeDirectory
          uv run python packaging/macos/check_pkg.py

      # The setup as a user runs it (silently here): install, an update in place, the uninstaller.
      - name: Windows setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          uv run python packaging/windows/build_setup.py
          uv run python packaging/windows/check_setup.py (Get-Item build/app/MidiBakery-*-windows-x64-setup.exe).FullName

      - uses: actions/upload-artifact@v7
        with:
          name: midibakery-${{ matrix.os }}
          path: |
            build/app/MidiBakery-*.zip
            build/app/MidiBakery-*.pkg
            build/app/MidiBakery-*-setup.exe
          if-no-files-found: error
          retention-days: 14

  # A release (tag v<version>): the update service, then the installers and their signed manifest in R2.
  # The secrets live in the GitHub environment "release" (see services/updates/README.md); nothing else
  # sees them. The channel file goes up last: until then the app still finds the previous release.
  worker:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Worker tests
        working-directory: services/updates
        run: node --test test/worker.test.js

      - name: Deploy the update service
        working-directory: services/updates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.147.0 deploy

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app, worker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: uv sync --locked

      - name: The tag names this version
        run: |
          version=$(uv run python -c "import midibakery; print(midibakery.__version__)")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} but version ${version}"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          pattern: midibakery-*
          path: release
          merge-multiple: true

      - name: Sign the manifest
        env:
          MIDIBAKERY_SIGNING_KEY: ${{ secrets.MIDIBAKERY_SIGNING_KEY }}
        run: uv run python packaging/release/make_manifest.py release stable.json --channel stable

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          put() { npx --yes wrangler@4.147.0 r2 object put "midibakery-releases/$1" --file "$2" --content-type "$3" --remote; }
          for file in release/MidiBakery-*.pkg release/MidiBakery-*-setup.exe; do
            put "midibakery/releases/${VERSION}/$(basename "$file")" "$file" application/octet-stream
          done
          put midibakery/channels/stable.json stable.json application/json
