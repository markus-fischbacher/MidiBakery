name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0  # setup-uv publishes no moving major tag
        with:
          enable-cache: true

      # The Max for Live devices' JavaScript (analysis, MIDI Tool logic) runs on Max's Node 22;
      # the tests that run it must not skip here (MIDIBAKERY_REQUIRE_NODE below).
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # 3.12+ runs the core; 3.11 is Live 12's embedded Python, used to check
      # that the Remote Script compiles there (test_remote_script_compiles_on_lives_python).
      - name: Install Python
        run: uv python install 3.12 3.11

      - name: Install dependencies
        run: uv sync --locked

      - name: Op manifest matches the catalog
        run: uv run midibakery manifest --check

      # Pinned: a new ruff release must not turn CI red on its own.
      - name: Lint (errors only)
        run: uvx ruff@0.17.1 check --select F,E9 packages tests

      - name: Tests
        env:
          MIDIBAKERY_REQUIRE_NODE: "1"
        run: uv run pytest -q -rs

  # Install paths, the Remote Script's launcher and the Credential Manager behave differently on
  # Windows; the rest of the suite is platform-neutral and runs above.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Windows tests
        run: uv run pytest -q -rs tests/test_install.py tests/test_launcher.py tests/test_credentials.py tests/test_version.py
