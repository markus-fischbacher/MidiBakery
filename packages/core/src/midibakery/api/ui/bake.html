<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MidiBakery Bake</title>
<style>
  :root {
    --bg: #19191b; --panel: #232427; --raise: #2c2d31; --line: #36373c; --text: #e6e6e8; --dim: #8b8c93;
    --accent: #ffad56; --accent-ink: #1a1206; --accent-soft: rgba(255, 173, 86, .14);
    --err: #ff7a7a; --ok: #6fd48a; --r: 7px;
    font: 12px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body { display: flex; flex-direction: column; gap: 7px; padding: 8px 10px; overflow: hidden; user-select: none; }
  .row { display: flex; gap: 7px; align-items: stretch; min-height: 0; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
    padding: 0 10px; cursor: pointer; transition: background .12s, border-color .12s, color .12s; }
  button:hover:not(:disabled) { background: var(--raise); border-color: #4a4b52; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .35; cursor: default; }
  button.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  /* segmented control: the genres and lengths as one joined bar */
  .seg { display: flex; flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); padding: 2px; gap: 2px; }
  .seg button { flex: 1; min-width: 0; border: 0; background: transparent; border-radius: 5px; padding: 0 2px; height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg button:hover:not(:disabled) { background: var(--raise); }
  .seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .tool { height: 28px; flex: none; }
  #lengths { flex: 3; }
  #complexities { flex: 2; }
  #ref-name { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #ref-name::before { content: "After  "; color: var(--dim); }
  #ref-name.on::before { color: var(--accent); opacity: .7; }
  #lengths { flex: none; width: 190px; }
  #complexities { flex: none; width: 96px; }
  .actions { align-items: center; }
  .big { height: 34px; font-size: 13px; padding: 0 14px; flex: none; }
  .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; min-width: 96px; }
  .primary:hover:not(:disabled) { background: #ffbd77; border-color: #ffbd77; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; margin-top: 3px; }
  .dot.on { background: var(--ok); }
  .dot.busy { background: var(--accent); animation: p 1s ease-in-out infinite; }
  @keyframes p { 50% { opacity: .3; } }
  .state { flex: 1; min-width: 0; display: flex; gap: 7px; align-items: flex-start; padding-left: 4px; }
  .status { min-width: 0; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .status.err { color: var(--err); }
  .overlay { position: fixed; inset: 0; background: var(--bg); padding: 8px 10px; overflow-y: auto; display: none; }
  .overlay.open { display: block; }
  .overlay h4 { margin: 0 0 6px; color: var(--dim); font-weight: 500; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
  .ref { display: flex; gap: 8px; padding: 6px 8px; border-radius: 5px; cursor: pointer; }
  .ref:hover { background: var(--panel); }
  .ref .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ref .meta { color: var(--dim); font-size: 10px; align-self: center; white-space: nowrap; }
  .ref .meta.now { color: var(--accent); }
</style>
</head>
<body>
<div class="row"><div class="seg" id="genres"></div></div>
<div class="row">
  <div class="seg" id="lengths"></div>
  <div class="seg" id="complexities" title="Rich: layered lead and bass, an answer voice, more FX. Simple: one voice per role"></div>
</div>
<div class="row">
  <button class="tool" id="my-loops" title="The seed draws drums, bass, lead and chords from your imported Sets">My loops</button>
  <button class="tool" id="ref-name" title="Follow the structure of an imported Set or analyzed song">No reference</button>
</div>
<div class="row actions">
  <button class="big primary" id="bake" title="A new song after the last clip in the Arrangement">Bake</button>
  <button class="big" id="again" title="Replace the last song with another seed" disabled>Again</button>
  <button class="big" id="back" title="Replace the last song with the seed before" disabled>Back</button>
  <div class="state"><span class="dot" id="dot"></span><span class="status" id="status">Connecting...</span></div>
</div>
<div class="overlay" id="refs"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.hash.slice(1)).get("token");
addEventListener("hashchange", () => location.reload());  // a new token: the API restarted

const GENRE_LABELS = { house: "House", melodic_techno: "Melodic", peak_time_techno: "Peak-Time", drum_and_bass: "D&B", trap: "Trap" };
const LENGTH_LABELS = { radio: "Radio", standard: "Standard", extended: "Extended" };
const COMPLEXITY_LABELS = { simple: "Simple", rich: "Rich" };
const KEY = "midibakery-bake";
let choice = { genre: "house", length: "standard", complexity: "rich", reference: null, my_loops: false };
try { Object.assign(choice, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (_) {}
let options = null, busy = false;

function save() { try { localStorage.setItem(KEY, JSON.stringify(choice)); } catch (_) {} }

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { Authorization: `Bearer ${token}`, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || data.error || `HTTP ${res.status}`);
  return data;
}

function status(text, kind) {
  $("status").textContent = text;
  $("status").className = "status" + (kind === "err" ? " err" : "");
  $("status").title = text;
  $("dot").className = "dot " + (kind === "busy" ? "busy" : kind === "off" ? "" : "on");
}

function chips(holder, labels, key) {
  holder.textContent = "";
  for (const [value, label] of Object.entries(labels)) {
    const b = document.createElement("button");
    b.textContent = label;
    b.className = choice[key] === value ? "on" : "";
    b.onclick = () => { choice[key] = choice[key] === value && key === "genre" && choice.reference ? null : value; save(); render(); if (key === "genre" && options) announceGenre(); };
    holder.append(b);
  }
}

function describe(baked) {
  if (!baked) return "Ready. Bake writes a song after the last clip in the Arrangement.";
  const what = baked.reference ? `after ${baked.reference}` : GENRE_LABELS[baked.genre] || baked.genre;
  const level = baked.complexity === "simple" ? " · simple" : "";
  return `${what}${level} · bars ${baked.bars} · seed ${baked.seed}`;
}

function render() {
  chips($("genres"), GENRE_LABELS, "genre");
  chips($("lengths"), LENGTH_LABELS, "length");
  chips($("complexities"), COMPLEXITY_LABELS, "complexity");
  $("my-loops").className = "tool" + (choice.my_loops ? " on" : "");
  $("my-loops").disabled = Boolean(options && !options.my_loops);
  $("ref-name").textContent = choice.reference || "none";
  $("ref-name").className = "tool" + (choice.reference ? " on" : "");
  const baked = options && options.baked;
  $("bake").disabled = busy || !options || (!choice.genre && !choice.reference);
  $("again").disabled = busy || !baked;
  $("back").disabled = busy || !baked || !baked.can_go_back;
}

function showRefs() {
  const list = $("refs");
  list.textContent = "";
  const none = document.createElement("div");
  none.className = "ref";
  none.innerHTML = '<span class="name">No reference: the genre\'s recipe</span>';
  none.onclick = () => pickRef(null);
  list.append(none);
  for (const ref of options.references) {
    const row = document.createElement("div");
    row.className = "ref";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = ref.name;
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = [ref.source === "als" ? "Live Set" : "audio", ref.genre && GENRE_LABELS[ref.genre], ref.tempo && `${Math.round(ref.tempo)} BPM`].filter(Boolean).join(" · ");
    row.append(name, meta);
    row.onclick = () => pickRef(ref.name);
    list.append(row);
  }
  if (!options.references.length) {
    const empty = document.createElement("div");
    empty.className = "ref meta";
    empty.textContent = "No references yet: import Live Sets with the Set Importer or analyze a song with the Reference Analyzer.";
    list.append(empty);
  }
  list.classList.add("open");
}

// A preset dropped on the device is for the genre chosen here: tell the API which (the sounds themselves are
// set in the Sounds... window).
function announceGenre() { api(`/sounds?genre=${encodeURIComponent(choice.genre || "")}`).catch(() => {}); }

function pickRef(name) {
  choice.reference = name;
  $("refs").classList.remove("open");
  save();
  render();
}

async function run(mode) {
  if (busy) return;
  busy = true;
  render();
  status(mode === "new" ? "Baking..." : mode === "again" ? "Baking another one..." : "Going back...", "busy");
  try {
    const body = mode === "back" ? { mode } : { mode, genre: choice.genre, length: choice.length, complexity: choice.complexity, reference: choice.reference, my_loops: choice.my_loops };
    const result = await api("/bake/run", body);
    options.baked = result.baked;
    const tempo = result.tempo ? ` · ${Math.round(result.tempo)} BPM` : "";
    const warn = result.warnings && result.warnings.length ? ` · ⚠ ${result.warnings[0]}` : "";
    status(describe(result.baked) + tempo + warn);
  } catch (err) {
    status(err.message, "err");
  } finally {
    busy = false;
    render();
  }
}

async function load() {
  try {
    options = await api("/bake/options");
    if (choice.reference && !options.references.some((r) => r.name === choice.reference)) choice.reference = null;
    if (!options.my_loops) choice.my_loops = false;
    announceGenre();
    status(describe(options.baked));
  } catch (err) {
    status(`Not connected: ${err.message}`, "off");
    setTimeout(load, 3000);
  }
  render();
}

setInterval(() => { if (options) announceGenre(); }, 5000);  // the API restarts and forgets it

$("my-loops").onclick = () => { choice.my_loops = !choice.my_loops; save(); render(); };
$("ref-name").onclick = () => { if (options) showRefs(); };
$("bake").onclick = () => run("new");
$("again").onclick = () => run("again");
$("back").onclick = () => run("back");
render();
if (token) load(); else status("No token: open this page from the Bake device.", "off");
if (window.max && window.max.outlet) window.max.outlet("loaded");
</script>
</body>
</html>
