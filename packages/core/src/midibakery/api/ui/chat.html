<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MidiBakery</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #2a2a2a; --line: #3a3a3a; --text: #d9d9d9; --dim: #8a8a8a;
    --accent: #ffad56; --user: #3b4a5a; --err: #ff6b6b; --ok: #7fd18b;
    font: 12px/1.35 -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body { display: flex; flex-direction: column; }
  header { display: flex; gap: 6px; align-items: center; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  header .dot.on { background: var(--ok); }
  header .dot.busy { background: var(--accent); }
  header .status { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  select, button, input { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 3px; }
  select, button { padding: 1px 6px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #1e1e1e; border-color: var(--accent); }
  #log { flex: 1; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
  .msg { padding: 3px 6px; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; max-width: 95%; }
  .msg.user { background: var(--user); align-self: flex-end; }
  .msg.assistant { background: var(--panel); align-self: flex-start; }
  .msg.thinking { color: var(--dim); font-style: italic; align-self: flex-start; }
  /* Thinking is collapsed to one line; click the line to read it. */
  .think-head { cursor: pointer; user-select: none; }
  .msg.thinking.collapsed .think-body { display: none; }
  /* Click an answer (or opened thinking) to copy it (jweb in Live passes no Cmd+C). */
  .msg.assistant, .msg.thinking:not(.collapsed) .think-body { cursor: copy; }
  .msg.copied { outline: 1px solid var(--ok); }
  .tool { color: var(--dim); font-family: Menlo, monospace; font-size: 11px; align-self: flex-start; }
  .tool.err { color: var(--err); }
  .error { color: var(--err); align-self: flex-start; }
  .confirm { align-self: flex-start; background: var(--panel); border: 1px solid var(--accent); border-radius: 4px; padding: 4px 6px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .usage { color: var(--dim); font-size: 10px; align-self: flex-end; }
  form { display: flex; gap: 4px; padding: 4px 6px; border-top: 1px solid var(--line); }
  #input { flex: 1; padding: 3px 6px; }
  #input:disabled { opacity: .5; }
  .seg { display: flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 3px 0 0 3px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 3px 3px 0; }
  .seg button.on { background: var(--accent); color: #1e1e1e; border-color: var(--accent); }
  .note { color: var(--dim); font-size: 10px; align-self: center; }
  /* While the model works: phase + elapsed seconds, with animated dots. */
  .pending { color: var(--accent); font-size: 11px; align-self: flex-start; }
  .pending .dots::after { content: ""; animation: dots 1.2s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .pending .secs { color: var(--dim); margin-left: 4px; }
  /* Inside the Max for Live device the input is a native Max text field below this page:
     Live does not pass keystrokes to jweb. */
  body.device form { display: none; }
  body.device #modelSelect { display: none; }  /* the device has a native Model menu (umenu) */
  #modelSelect { max-width: 220px; padding: 1px 4px; }
  /* Live status line: transport, tempo, scale and what plays (from the bridge's state events). */
  #live { padding: 1px 6px; font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid var(--line); }
  #live[hidden] { display: none; }
  #live .play { color: var(--ok); }
  #live .rec { color: var(--err); }
  /* Claude API key: a password field in the browser; in the device the next line typed into the
     Max text field is taken as the key (jweb gets no keystrokes). */
  /* A newer MidiBakery (the API's daily update check): Install downloads, verifies and opens its installer. */
  #update { display: flex; gap: 6px; align-items: center; padding: 3px 6px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #update[hidden] { display: none; }
  #update .text { flex: 1; }
  #update .text.err { color: var(--err); }
  /* Trial and license (GET /license): shown while it matters - no license yet, a trial, an ended one. */
  #licensePanel { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 3px 6px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #licensePanel[hidden] { display: none; }
  #licensePanel .text { flex: 1; }
  #licensePanel .text.err { color: var(--err); }
  #licenseEntry { display: flex; gap: 6px; flex: 1 1 100%; align-items: center; }
  #licenseEntry[hidden] { display: none; }
  body:not(.device) .device-only { display: none; }
  #licenseInput { flex: 1; min-width: 160px; padding: 2px 6px; text-transform: uppercase; }
  #keyPanel { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 4px 6px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #keyPanel[hidden] { display: none; }
  #keyPanel .text { flex: 1 1 100%; }
  #keyPanel .text.err { color: var(--err); }
  #keyInput { flex: 1; min-width: 160px; padding: 2px 6px; }
  body.device #keyInput, body.device #keySave { display: none; }
  body:not(.device) #keyTypeHint { display: none; }
  /* Plan diff: a small before/after piano roll per clip. Green = added, orange = changed,
     red outline = removed, grey = kept. Click a roll to make it taller. */
  .plan { align-self: stretch; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; display: flex; flex-direction: column; gap: 2px; }
  .plan.open { border-color: var(--accent); }
  .plan .head { display: flex; gap: 6px; align-items: center; }
  .plan .head .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plan .head .state { color: var(--dim); font-size: 11px; white-space: nowrap; }
  .plan .head .state.ok { color: var(--ok); }
  .plan .clip { color: var(--dim); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plan svg { display: block; width: 100%; height: 34px; background: var(--bg); border-radius: 2px; cursor: zoom-in; }
  .plan svg.tall { height: 110px; cursor: zoom-out; }
  /* Song timeline (plan_song): sections as columns sized by bars, roles as rows. */
  .song .grid { display: grid; grid-template-columns: 44px 1fr; gap: 1px 4px; align-items: center; font-size: 10px; }
  .song .role { color: var(--dim); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song .lane { display: flex; gap: 1px; height: 8px; }
  .song .lane span { background: var(--bg); border-radius: 1px; }
  .song .lane span.on { background: var(--accent); }
  .song .lane span.half { background: linear-gradient(90deg, var(--bg) 50%, var(--accent) 50%); }
  .song .lane span.soft { background: #7a5a3a; }
  .song .names { display: flex; gap: 1px; height: 12px; }
  .song .names span { color: var(--dim); overflow: hidden; white-space: nowrap; text-overflow: clip; font-size: 9px; }
  .song .meta { color: var(--dim); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song .warn { color: var(--accent); font-size: 10px; }
  .master .clip { white-space: normal; }
  .master .meta { color: var(--dim); font-size: 10px; }
  .master .warn { color: var(--accent); font-size: 10px; }
  .plan .n-keep { fill: #6a6a6a; }
  .plan .n-add { fill: var(--ok); }
  .plan .n-mod { fill: var(--accent); }
  .plan .n-del { fill: none; stroke: var(--err); stroke-dasharray: 2 1.5; }
  .plan .bar { stroke: var(--line); }
  /* jweb in Live can render a little taller than the device; keep the last lines clear of the edge. */
  body.device #log { padding-bottom: 22px; }
</style>
</head>
<body>
<header>
  <span id="dot" class="dot" title="Connection"></span>
  <span id="status" class="status">Connecting…</span>
  <!-- Browser only: dropdowns do not open inside jweb; the device shows the same list in a Max menu. -->
  <select id="modelSelect" title="Model"></select>
  <button id="stopTop" type="button" title="Stop the current answer" hidden>Stop</button>
  <button id="undo" type="button" title="Undo the last change in Live" disabled>Undo</button>
  <!-- Only while a Claude model is chosen; "Key ✓" once one is stored. -->
  <button id="keyButton" type="button" title="Claude API key" hidden>Key</button>
  <button id="copyAll" type="button" title="Copy the whole conversation (thinking, tool calls, answers) to the clipboard">Copy</button>
  <button id="reset" type="button" title="Forget the conversation">New</button>
</header>
<div id="live" hidden title="What Live is doing"></div>
<div id="update" hidden>
  <span id="updateText" class="text"></span>
  <button id="updateInstall" class="primary" type="button">Install</button>
  <button id="updateLater" type="button">Later</button>
</div>
<div id="licensePanel" hidden>
  <span id="licenseText" class="text"></span>
  <button id="licenseTrial" class="primary" type="button" hidden>Start trial</button>
  <button id="licenseEnter" type="button">Enter key</button>
  <button id="licenseLater" type="button" hidden>Later</button>
  <div id="licenseEntry" hidden>
    <span class="note device-only">Type the key into the message field on the right and press Enter.</span>
    <input id="licenseInput" autocomplete="off" placeholder="MB-XXXX-XXXX-XXXX-XXXX">
    <button id="licenseSave" class="primary" type="button">Activate</button>
  </div>
</div>
<div id="keyPanel" hidden>
  <span id="keyText" class="text"></span>
  <span id="keyTypeHint" class="note">Paste the key into the message field on the right and press Enter. It is not sent to any model.</span>
  <input id="keyInput" type="password" autocomplete="off" placeholder="sk-ant-…">
  <button id="keySave" class="primary" type="button">Save</button>
  <button id="keyRemove" type="button" hidden>Remove</button>
  <button id="keyClose" type="button">Close</button>
</div>
<div id="log" aria-live="polite"></div>
<form id="form">
  <input id="input" autocomplete="off" placeholder="Ask MidiBakery… e.g. 4 bars of deep house drums on track 1" disabled>
  <button id="send" class="primary" type="submit" disabled>Send</button>
  <button id="stop" type="button" hidden>Stop</button>
</form>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const log = $("log");
const hash = new URLSearchParams(location.hash.slice(1));
const token = hash.get("token");
// The token is read once; a new one (the API restarted) needs a fresh page.
addEventListener("hashchange", () => location.reload());
const CHOICE_KEY = "midibakery.choice";

let ws = null;
let busy = false;
let current = null;      // assistant message element being streamed
let thinking = null;     // thinking element being streamed
let retry = 0;
let keyMode = false;     // device: the next line from the Max text field is the API key
let licenseMode = false; // device: the next line from the Max text field is the license key
const plans = new Map();  // plan_id -> plan card, to mark it applied
const calls = new Map();  // tool call id -> { name, input, result } for the plan card and Apply

const inDevice = Boolean(window.max && window.max.bindInlet);
if (inDevice) document.body.classList.add("device");

// The chosen model: provider "" + model "" = whatever `midibakery api` was started with.
let choice = { provider: hash.get("provider") || "", model: "" };
try { choice = { ...choice, ...JSON.parse(localStorage.getItem(CHOICE_KEY) || "{}") }; } catch (_) {}
let models = [];  // from GET /models

const sameChoice = (a, b) => a.provider === b.provider && a.model === b.model;

async function loadModels() {
  try {
    const response = await fetch("/models", { headers: { Authorization: `Bearer ${token}` } });
    if (!response.ok) return;
    models = (await response.json()).models || [];
  } catch (_) {
    return;
  }
  if (!models.some((m) => sameChoice(m, choice))) setChoice({ provider: "", model: "" });  // e.g. model removed
  const index = models.findIndex((m) => sameChoice(m, choice));
  const select = $("modelSelect");
  select.replaceChildren(...models.map((m, i) => new Option(m.label, String(i))));
  select.value = String(index);
  if (inDevice) {
    window.max.outlet("menu_clear");
    for (const m of models) window.max.outlet("menu_append", m.label);
    window.max.outlet("menu_select", index);
  }
}

function add(cls, text) {
  const el = document.createElement("div");
  el.className = cls;
  el.textContent = text;
  // The progress line always stays last.
  if (pending.el && pending.el.parentNode === log) log.insertBefore(el, pending.el);
  else log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

// Progress line while the model is working ("Thinking... 4 s", "Running get_session... 1 s").
const pending = { el: null, since: 0, timer: null };

function showPending(label) {
  if (!pending.el) {
    pending.el = document.createElement("div");
    pending.el.className = "pending";
    pending.el.innerHTML = '<span class="label"></span><span class="dots"></span><span class="secs"></span>';
  }
  pending.el.querySelector(".label").textContent = label;
  pending.since = Date.now();
  log.appendChild(pending.el);
  renderPending();
  if (!pending.timer) pending.timer = setInterval(renderPending, 1000);
  log.scrollTop = log.scrollHeight;
}

function renderPending() {
  if (pending.el) pending.el.querySelector(".secs").textContent = `${Math.floor((Date.now() - pending.since) / 1000)} s`;
}

function hidePending() {
  clearInterval(pending.timer);
  pending.timer = null;
  if (pending.el) pending.el.remove();
}

function setBusy(value) {
  busy = value;
  $("dot").className = "dot " + (ws && ws.readyState === 1 ? (busy ? "busy" : "on") : "");
  $("input").disabled = !ws || ws.readyState !== 1 || busy;
  $("send").disabled = $("input").disabled;
  $("stop").hidden = !busy;
  $("stopTop").hidden = !busy || !inDevice;
  $("undo").disabled = $("input").disabled;
  if (!busy) $("input").focus();
}

function brief(value, limit = 140) {
  const text = typeof value === "string" ? value : JSON.stringify(value);
  return text.length > limit ? text.slice(0, limit - 1) + "…" : text;
}

function connect() {
  if (!token) {
    $("status").textContent = "No access token. Open this page from the MidiBakery device.";
    return;
  }
  const url = `ws://${location.host}/chat?token=${encodeURIComponent(token)}`
    + (choice.provider ? `&provider=${encodeURIComponent(choice.provider)}` : "")
    + (choice.model ? `&model=${encodeURIComponent(choice.model)}` : "");
  ws = new WebSocket(url);
  $("status").textContent = "Connecting…";
  ws.onopen = () => { retry = 0; setBusy(false); };
  ws.onclose = (event) => {
    hidePending();
    setBusy(false);
    if (event.code === 4401) { $("status").textContent = "Access denied: the API was restarted. Reload the device."; return; }
    if (event.code === 4402) { $("status").textContent = "Claude needs an API key."; return; }
    $("status").textContent = "Disconnected. Is `midibakery api` running? Retrying…";
    setTimeout(connect, Math.min(10000, 1000 * 2 ** retry++));
  };
  ws.onmessage = (event) => followBottom(() => handle(JSON.parse(event.data)));
}

// Keep the newest output in view (streamed thinking and text included), unless the user
// scrolled up to read; scrolling back to the bottom resumes following.
function followBottom(update) {
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  update();
  if (atBottom) log.scrollTop = log.scrollHeight;
}

// Thinking streams into a collapsed block (header + body): all the tokens arrive, few are shown.
function addThinking() {
  const el = add("msg thinking collapsed", "");
  const head = document.createElement("div");
  head.className = "think-head";
  const body = document.createElement("div");
  body.className = "think-body";
  el.append(head, body);
  el.body = body;
  el.updateHead = () => {
    const words = body.textContent.split(/\s+/).filter(Boolean).length;
    head.textContent = `${el.classList.contains("collapsed") ? "▸" : "▾"} Thinking · ${words} words`;
  };
  head.onclick = () => { el.classList.toggle("collapsed"); el.updateHead(); };
  el.updateHead();
  return el;
}

function handle(ev) {
  switch (ev.type) {
    case "ready":
      $("status").textContent = `${ev.provider} · ${ev.model} · ${ev.tools} tools`;
      showKeyButton(ev.provider);  // also covers "Default" when the API runs with Claude
      setBusy(false);
      break;
    case "live_state":
      showLive(ev);
      break;
    case "thinking":
      if (!thinking) thinking = addThinking();
      if (pending.el && pending.el.querySelector(".label").textContent !== "Thinking") showPending("Thinking");
      thinking.body.textContent += ev.text;
      thinking.updateHead();
      break;
    case "text":
      thinking = null;
      if (!current) {
        current = add("msg assistant", "");
        showPending("Writing");
      }
      current.textContent += ev.text;
      log.scrollTop = log.scrollHeight;
      break;
    case "tool_call":
      current = null; thinking = null;
      calls.set(ev.id, { name: ev.name, input: ev.input || {} });
      // The page's own buttons (Apply, Undo) say what happened when the result comes in.
      if (ev.source !== "user") add("tool", `→ ${ev.name} ${brief(ev.input)}`);
      showPending(ev.source === "user" ? (ev.name === "undo" ? "Undoing" : "Applying") : `Running ${ev.name}`);
      break;
    case "tool_result": {
      if (!calls.has(ev.id)) calls.set(ev.id, { name: ev.name, input: {} });
      const call = calls.get(ev.id);
      call.result = ev.result;
      if (ev.is_error) add("tool err", `✗ ${ev.name === "undo" && ev.source === "user" ? "Undo: " : ""}${brief(ev.result, 220)}`);
      if (ev.name === "apply_plan") planApplied(call.input.plan_id, ev.is_error);
      if (ev.name === "plan_song" && !ev.is_error && ev.result && ev.result.sections) showSong(ev.result);
      if (ev.name === "plan_master" && !ev.is_error && ev.result && ev.result.master_chain) showMaster(ev.result);
      if (ev.name === "undo" && ev.source === "user" && !ev.is_error) add("note", "↶ Undone in Live");
      if (ev.source !== "user") showPending("Thinking");
      break;
    }
    case "plan":
      showPlan(ev);
      break;
    case "confirm":
      hidePending();  // waiting for the user, not the model
      askConfirm(ev);
      break;
    case "done": {
      hidePending();
      current = null; thinking = null;
      const u = ev.usage || {};
      if (u.input_tokens != null) add("usage", `${u.input_tokens} in / ${u.output_tokens} out` + (u.cache_read_input_tokens ? `, ${u.cache_read_input_tokens} cached` : ""));
      setBusy(false);
      break;
    }
    case "error":
      hidePending();
      current = null; thinking = null;
      if (ev.code === "LICENSE_REQUIRED") { setBusy(false); checkLicense(true); break; }
      if (ev.code === "NO_API_KEY") { showKeyButton("anthropic"); openKeyPanel("Claude needs an API key. It is stored in your system's credential store (Keychain on macOS), not in MidiBakery's files."); break; }
      add("error", ev.message);
      setBusy(false);
      break;
    case "reset":
      hidePending();
      plans.clear(); calls.clear();
      log.textContent = "";
      add("note", "New conversation");
      break;
  }
}

// --- Plan diff ---------------------------------------------------------------

const svgEl = (tag, attrs, parent) => {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
};
const NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const pitchName = (p) => NAMES[p % 12] + (Math.floor(p / 12) - 2);  // 60 = C3 as in Live

// Notes of one clip before and after: kept, removed, changed (new position) and added.
function clipNotes(clip) {
  const removed = new Set(clip.remove || []);
  const changes = new Map((clip.modify || []).map((m) => [m.note_id, m]));
  const notes = [];
  for (const [id, pitch, start, dur, vel] of clip.existing || []) {
    if (removed.has(id)) notes.push({ pitch, start, dur, vel, kind: "del" });
    else if (changes.has(id)) {
      const c = changes.get(id);
      notes.push({ pitch, start, dur, vel, kind: "del" });
      notes.push({ pitch: c.pitch ?? pitch, start: c.start_time ?? start, dur: c.duration ?? dur, vel: c.velocity ?? vel, kind: "mod" });
    } else notes.push({ pitch, start, dur, vel, kind: "keep" });
  }
  for (const [pitch, start, dur, vel] of clip.add || []) notes.push({ pitch, start, dur, vel, kind: "add" });
  return notes;
}

function drawRoll(clip, beatsPerBar) {
  const notes = clipNotes(clip);
  if (!notes.length) return null;
  const lo = Math.max(0, Math.min(...notes.map((n) => n.pitch)) - 1);
  const hi = Math.min(127, Math.max(...notes.map((n) => n.pitch)) + 1);
  const length = Math.max(clip.length || 0, ...notes.map((n) => n.start + n.dur), 1);
  // viewBox units: 16 per beat, 4 per semitone; the SVG stretches to the card (preserveAspectRatio none).
  const W = length * 16, H = (hi - lo + 1) * 4;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none", role: "img" });
  for (let b = beatsPerBar; b < length; b += beatsPerBar) {
    svgEl("line", { class: "bar", x1: b * 16, x2: b * 16, y1: 0, y2: H, "vector-effect": "non-scaling-stroke" }, svg);
  }
  const order = { keep: 0, del: 1, mod: 2, add: 3 };
  for (const n of notes.sort((a, b) => order[a.kind] - order[b.kind])) {
    const rect = svgEl("rect", {
      class: `n-${n.kind}`, x: n.start * 16, y: (hi - n.pitch) * 4 + 0.5, width: Math.max(1.5, n.dur * 16 - 0.5), height: 3,
      "vector-effect": "non-scaling-stroke", opacity: n.kind === "del" ? 1 : (0.45 + 0.55 * Math.min(127, n.vel) / 127).toFixed(2),
    }, svg);
    svgEl("title", {}, rect).textContent =
      `${{ keep: "kept", del: "removed", mod: "changed", add: "added" }[n.kind]} ${pitchName(n.pitch)} · beat ${+n.start.toFixed(3)} · len ${+n.dur.toFixed(3)}`;
  }
  svg.onclick = () => svg.classList.toggle("tall");
  return svg;
}

function showPlan(ev) {
  const roll = ev.roll || {};
  const clips = roll.clips || [];
  const summary = ((calls.get(ev.id) || {}).result || {}).changes || [];
  const [num, den] = String(roll.time_signature || "4/4").split("/").map(Number);
  const card = add("plan", "");
  const head = document.createElement("div");
  head.className = "head";
  const title = document.createElement("span");
  title.className = "title";
  const added = clips.reduce((sum, c) => sum + (c.add || []).length, 0);
  const removed = clips.reduce((sum, c) => sum + (c.remove || []).length, 0);
  const changed = clips.reduce((sum, c) => sum + (c.modify || []).length, 0);
  title.textContent = `◇ ${ev.name}: ${clips.length} clip(s) · +${added} ~${changed} −${removed}` + (roll.scale ? ` · ${roll.scale}` : "");
  const state = document.createElement("span");
  state.className = "state";
  head.append(title, state);
  card.append(head);
  for (const [i, clip] of clips.entries()) {
    const change = summary[i] || {};
    const line = document.createElement("div");
    line.className = "clip";
    const where = clip.start != null ? `Arrangement bar ${clip.bar ?? clip.start}` : clip.arrangement_clip != null ? `arrangement clip ${clip.arrangement_clip + 1}` : `slot ${clip.slot + 1}`;
    const bits = [`Track ${clip.track + 1} · ${where} · ${clip.kind}`, change.action,
      `+${(clip.add || []).length} ~${(clip.modify || []).length} −${(clip.remove || []).length}`];
    if (change.chords) bits.push(change.chords.join(" – "));
    line.textContent = bits.filter(Boolean).join(" · ");
    card.append(line);
    const svg = drawRoll(clip, (num * 4) / den || 4);
    if (svg) card.append(svg);
  }
  if (roll.applied || !roll.plan_id) {
    state.textContent = roll.applied ? "✓ written" : "";
    state.classList.add("ok");
    return;
  }
  card.classList.add("open");
  state.textContent = "preview";
  const apply = document.createElement("button");
  apply.className = "primary";
  apply.textContent = "Apply";
  apply.title = "Write this plan to Live as one undo step";
  apply.onclick = () => {
    if (busy) { add("note", "Still answering - press Stop first."); return; }
    if (!ws || ws.readyState !== 1) { add("note", "Not connected yet."); return; }
    apply.disabled = true;
    ws.send(JSON.stringify({ type: "tool", name: "apply_plan", input: { plan_id: roll.plan_id } }));
    setBusy(true);
    showPending("Applying");
  };
  head.append(apply);
  plans.set(roll.plan_id, { card, state, apply });
}

function planApplied(planId, failed) {
  const plan = plans.get(planId);
  if (!plan) return;
  if (failed) { plan.apply.disabled = false; return; }
  plans.delete(planId);
  plan.apply.remove();
  plan.card.classList.remove("open");
  plan.state.textContent = plan.done || "✓ applied · Undo reverts it";
  plan.state.classList.add("ok");
}

// A whole song (plan_song): one column per section, as wide as its bars; one row per role,
// filled where the role plays ("tease"/"pad" parts lighter, parts entering late half-filled).
const ROLE_LABELS = { drums: "Drums", bass: "Bass", chords: "Chords", lead: "Lead" };

function partClass(spec) {
  if (!spec) return "";
  const segments = String(spec).split(",");
  if (segments[0].startsWith("-")) return "half";
  return /^(tease|pad|sparse|kick_hats)/.test(segments[0]) ? "soft" : "on";
}

function showSong(song) {
  const card = add("plan song open", "");
  const head = document.createElement("div");
  head.className = "head";
  const title = document.createElement("span");
  title.className = "title";
  title.textContent = `♪ ${song.genre} · ${song.bars} bars · ${song.duration} at ${+song.bpm} BPM · ${song.scale}`;
  const state = document.createElement("span");
  state.className = "state";
  state.textContent = "preview";
  head.append(title, state);
  card.append(head);

  const grid = document.createElement("div");
  grid.className = "grid";
  const label = (text) => { const el = document.createElement("span"); el.className = "role"; el.textContent = text; return el; };
  const names = document.createElement("div");
  names.className = "names";
  for (const s of song.sections) {
    const el = document.createElement("span");
    el.style.flex = s.bars;
    el.textContent = s.name;
    el.title = `${s.name}: bar ${s.bar}, ${s.bars} bars, energy ${s.energy}`;
    names.append(el);
  }
  grid.append(label(""), names);
  for (const role of Object.keys(song.tracks)) {
    const lane = document.createElement("div");
    lane.className = "lane";
    for (const s of song.sections) {
      const el = document.createElement("span");
      el.style.flex = s.bars;
      el.className = partClass(s.plays[role]);
      el.title = `${s.name}: ${s.plays[role] || "silent"}`;
      lane.append(el);
    }
    const track = song.tracks[role];
    const name = label(ROLE_LABELS[role] || role);
    name.title = `track ${track.track + 1} '${track.name}'${track.new ? ` (new, ${track.device})` : ""}`;
    grid.append(name, lane);
  }
  card.append(grid);

  const created = Object.values(song.tracks).filter((t) => t.new);
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = `from bar ${song.from_bar} · ${song.clips} clips` + (created.length ? ` · new: ${created.map((t) => `${t.name} (${t.device})`).join(", ")}` : "");
  card.append(meta);
  for (const warning of song.warnings || []) {
    const el = document.createElement("div");
    el.className = "warn";
    el.textContent = `⚠ ${warning}`;
    card.append(el);
  }

  const apply = document.createElement("button");
  apply.className = "primary";
  apply.textContent = "Apply";
  apply.title = "Write the song to the Arrangement View";
  apply.onclick = () => {
    if (busy) { add("note", "Still answering - press Stop first."); return; }
    if (!ws || ws.readyState !== 1) { add("note", "Not connected yet."); return; }
    apply.disabled = true;
    ws.send(JSON.stringify({ type: "tool", name: "apply_plan", input: { plan_id: song.plan_id } }));
    setBusy(true);
    showPending("Writing the song");
  };
  head.append(apply);
  plans.set(song.plan_id, { card, state, apply, done: "✓ in the Arrangement · Undo a few times to remove it" });
}

// A master chain (plan_master): one line per device with its settings, the notes, Apply.
function showMaster(master) {
  const card = add("plan master open", "");
  const head = document.createElement("div");
  head.className = "head";
  const title = document.createElement("span");
  title.className = "title";
  title.textContent = `▤ Master chain · ${master.genre}`;
  const state = document.createElement("span");
  state.className = "state";
  state.textContent = "preview";
  head.append(title, state);
  card.append(head);
  for (const d of master.master_chain) {
    const line = document.createElement("div");
    line.className = "clip";
    line.textContent = `${d.device} · ${d.settings}`;
    card.append(line);
  }
  for (const text of [...(master.notes || []), ...(master.warnings || []).map((w) => `⚠ ${w}`)]) {
    const el = document.createElement("div");
    el.className = text.startsWith("⚠") ? "warn" : "meta";
    el.textContent = text;
    card.append(el);
  }
  const apply = document.createElement("button");
  apply.className = "primary";
  apply.textContent = "Apply";
  apply.title = "Put the chain on the Master (two undo steps)";
  apply.onclick = () => {
    if (busy) { add("note", "Still answering - press Stop first."); return; }
    if (!ws || ws.readyState !== 1) { add("note", "Not connected yet."); return; }
    apply.disabled = true;
    ws.send(JSON.stringify({ type: "tool", name: "apply_plan", input: { plan_id: master.plan_id } }));
    setBusy(true);
    showPending("Applying");
  };
  head.append(apply);
  plans.set(master.plan_id, { card, state, apply, done: "✓ on the Master · Undo twice removes it" });
}

// One line: ▶/■ tempo · signature · scale · what plays (or starts / stops).
function showLive(ev) {
  const line = $("live");
  line.hidden = false;
  if (!ev.connected || !ev.state) { line.textContent = "Live not connected"; return; }
  const s = ev.state;
  const parts = [`${+s.tempo.toFixed(2)} BPM`, s.signature.join("/"), `${NAMES[s.root_note] || ""} ${s.scale_name}`.trim()];
  const playing = s.playing.map((p) => `${p.name}: ${p.clip || "clip " + (p.slot + 1)}`);
  // With the transport stopped Live keeps these clips as playing: they continue on Play.
  if (playing.length) parts.push((s.is_playing ? "" : "ready: ") + playing.slice(0, 2).join(", ") + (playing.length > 2 ? ` +${playing.length - 2}` : ""));
  if (s.launching.length) parts.push(`starting ${s.launching.map((l) => "track " + (l.track + 1)).join(", ")}`);
  if (s.stopping.length) parts.push(`stopping ${s.stopping.map((t) => "track " + (t + 1)).join(", ")}`);
  const icon = document.createElement("span");
  icon.className = s.record_mode ? "rec" : s.is_playing ? "play" : "";
  icon.textContent = s.record_mode ? "● " : s.is_playing ? "▶ " : "■ ";
  line.replaceChildren(icon, document.createTextNode(parts.join(" · ")));
  line.title = playing.length ? `Playing: ${playing.join(", ")}` : "Nothing playing";
}

function askConfirm(ev) {
  const box = add("confirm", "");
  const text = document.createElement("span");
  text.textContent = ev.message;
  const yes = document.createElement("button");
  yes.className = "primary"; yes.textContent = "Apply";
  const no = document.createElement("button");
  no.textContent = "Cancel";
  const answer = (accept) => {
    ws.send(JSON.stringify({ type: "confirm_reply", id: ev.id, accept }));
    showPending(accept ? "Applying" : "Thinking");
    box.replaceChildren(document.createTextNode(accept ? "✓ applied" : "✗ cancelled"));
  };
  yes.onclick = () => answer(true);
  no.onclick = () => answer(false);
  box.append(text, yes, no);
}

async function keyRequest(method, body) {
  const response = await fetch("/auth/anthropic", {
    method,
    headers: { Authorization: `Bearer ${token}`, "content-type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.message || `HTTP ${response.status}`);
  return data;
}

const SOURCES = { env: "from ANTHROPIC_API_KEY", keychain: "stored in your Keychain", credential_manager: "stored in Windows Credential Manager", file: "stored in MidiBakery's config folder", profile: "from your Anthropic profile (ant auth login)" };

// The Key button only matters for Claude; local models need no key.
function showKeyButton(provider) {
  const claude = provider === "anthropic";
  $("keyButton").hidden = !claude;
  if (!claude) { closeKeyPanel(); return; }
  keyRequest("GET").then(markKeyButton).catch(() => {});
}

function markKeyButton(state) {
  $("keyButton").textContent = state.configured ? "Key ✓" : "Key";
  $("keyButton").title = state.configured ? `Claude API key: ${SOURCES[state.source] || state.source}` : "Add a Claude API key";
}

function showKeyState(state, message, isError = false) {
  if ("configured" in state) markKeyButton(state);
  $("keyText").textContent = message || (state.configured ? `Claude key: ${SOURCES[state.source] || state.source}.` : "No Claude key yet.");
  $("keyText").className = "text" + (isError ? " err" : "");
  $("keyRemove").hidden = !["keychain", "credential_manager", "file"].includes(state.source);
}

async function openKeyPanel(message) {
  $("keyPanel").hidden = false;
  keyMode = inDevice;
  showKeyState({}, message || "Checking…");
  try {
    const state = await keyRequest("GET");
    showKeyState(state, message);
  } catch (error) {
    showKeyState({}, `Could not read the key status: ${error.message}`, true);
  }
  if (!inDevice) $("keyInput").focus();
}

function closeKeyPanel() {
  $("keyPanel").hidden = true;
  keyMode = false;
  $("keyInput").value = "";
}

async function saveKey(raw) {
  const key = String(raw || "").trim();
  if (!key) return;
  showKeyState({}, "Checking the key with the Claude API…");
  try {
    const state = await keyRequest("PUT", { api_key: key });
    closeKeyPanel();
    add("note", `Claude key saved (${SOURCES[state.source] || state.source}).`);
    if (ws) { ws.onclose = null; ws.close(); }
    connect();
  } catch (error) {
    keyMode = inDevice;  // let the user try again
    showKeyState({}, error.message, true);
  }
}

$("keyButton").onclick = () => ($("keyPanel").hidden ? openKeyPanel() : closeKeyPanel());
$("keyClose").onclick = closeKeyPanel;
$("keySave").onclick = () => saveKey($("keyInput").value);
$("keyInput").onkeydown = (event) => { if (event.key === "Enter") saveKey($("keyInput").value); };
$("keyRemove").onclick = async () => {
  try { showKeyState(await keyRequest("DELETE"), "Claude key removed."); } catch (error) { showKeyState({}, error.message, true); }
};

function sendText(raw) {
  if (keyMode) { keyMode = false; saveKey(raw); return true; }  // never shown, never sent to a model
  if (licenseMode) { licenseMode = false; activateLicense(raw); return true; }
  const text = String(raw || "").trim();
  if (!text) return false;
  if (busy) { add("note", "Still answering - press Stop first."); return false; }
  if (!ws || ws.readyState !== 1) { add("note", "Not connected yet."); return false; }
  add("msg user", text);
  log.scrollTop = log.scrollHeight;
  current = null; thinking = null;
  ws.send(JSON.stringify({ type: "user", text }));
  setBusy(true);
  showPending("Thinking");
  return true;
}

$("form").onsubmit = (event) => {
  event.preventDefault();
  if (sendText($("input").value)) $("input").value = "";
};
const stop = () => ws && ws.send(JSON.stringify({ type: "cancel" }));
$("stop").onclick = stop;
$("stopTop").onclick = stop;
$("undo").onclick = () => {
  if (busy || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: "tool", name: "undo", input: { action: "undo" } }));
  setBusy(true);
  showPending("Undoing");
};
// Copying: jweb gets no keystrokes, so Cmd+C cannot copy a selection inside Live.
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (_) {  // no Clipboard API (or no permission): the old way through a selected textarea
    const area = document.createElement("textarea");
    area.value = text;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (_) {}
    area.remove();
    return ok;
  }
}

const TRANSCRIPT_LABELS = [[".msg.user", "User"], [".msg.thinking", "Thinking"], [".msg.assistant", "Assistant"], [".error", "Error"]];

function transcript() {
  const lines = [];
  for (const el of log.children) {
    if (el === pending.el) continue;
    const label = TRANSCRIPT_LABELS.find(([selector]) => el.matches(selector));
    const text = (el.body ? el.body.textContent : el.innerText).trim();
    if (text) lines.push(label ? `${label[1]}: ${text}` : text);
  }
  return lines.join("\n\n");
}

$("copyAll").onclick = async () => {
  const ok = await copyText(transcript());
  $("copyAll").textContent = ok ? "Copied ✓" : "Copy failed";
  setTimeout(() => { $("copyAll").textContent = "Copy"; }, 1500);
};

log.addEventListener("click", async (event) => {
  const target = event.target.closest(".msg.assistant, .think-body");
  const msg = target && target.closest(".msg");
  if (!msg || String(window.getSelection())) return;  // leave a browser text selection alone
  if (await copyText((msg.body || msg).textContent)) {
    msg.classList.add("copied");
    setTimeout(() => msg.classList.remove("copied"), 800);
  }
});

$("reset").onclick = () => ws && ws.readyState === 1 && ws.send(JSON.stringify({ type: "reset" }));
function setChoice(next) {
  if (!next || sameChoice(next, choice)) return;
  choice = { provider: next.provider, model: next.model };
  try { localStorage.setItem(CHOICE_KEY, JSON.stringify(choice)); } catch (_) {}
  showKeyButton(choice.provider);  // "Default": decided when the connection reports its provider
  log.textContent = "";
  if (ws) { ws.onclose = null; ws.close(); }
  connect();
}

$("modelSelect").onchange = () => setChoice(models[Number($("modelSelect").value)]);
// The device's Model menu (umenu) sends "model_index <n>", in the order of the list sent to it.
if (inDevice) window.max.bindInlet("model_index", (n) => setChoice(models[Number(n)]));

// The device's Max text field sends "chat_input <words...>" on Enter or when its Send button is pressed.
if (inDevice) window.max.bindInlet("chat_input", (...words) => sendText(words.join(" ")));

// Inside the Max for Live device (jweb): tell the device the page is up.
try {
  if (window.max && window.max.outlet) {
    window.max.outlet("loaded");
    window.max.outlet("viewport", window.innerWidth, window.innerHeight, window.devicePixelRatio);  // for the device log
  }
} catch (_) {}

// ---- updates: the API checks once a day; "Later" hides the notice until the page reloads
const UPDATE_POLL_MS = 6 * 3600 * 1000;
let updateDismissed = false;

function showUpdate(message, { error = false, install = false } = {}) {
  $("update").hidden = false;
  $("updateText").textContent = message;
  $("updateText").classList.toggle("err", error);
  $("updateInstall").hidden = !install;
}

async function checkUpdate() {
  if (!token || updateDismissed) return;
  try {
    const response = await fetch("/update", { headers: { Authorization: `Bearer ${token}` } });
    const data = await response.json();
    if (data.update && data.update.included === false) {
      showUpdate(`MidiBakery ${data.update.version} is available; your license's updates have ended - renew to get it.`);
    } else if (data.update) {
      showUpdate(`MidiBakery ${data.update.version} is available (you have ${data.current}).`, { install: true });
    }
  } catch (_) {
    // the API is not reachable: the status line says so already
  }
}

$("updateInstall").addEventListener("click", async () => {
  $("updateInstall").disabled = true;
  showUpdate("Downloading and verifying the installer…");
  try {
    const response = await fetch("/update/install", { method: "POST", headers: { Authorization: `Bearer ${token}` } });
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || data.error || `HTTP ${response.status}`);
    showUpdate(`The installer for ${data.version} is open: follow it, then restart Live.`);
  } catch (error) {
    showUpdate(`Update failed: ${error.message}`, { error: true, install: true });
  } finally {
    $("updateInstall").disabled = false;
  }
});
$("updateLater").addEventListener("click", () => { updateDismissed = true; $("update").hidden = true; });

// ---- trial and license
let licenseDismissed = false;

async function licenseRequest(path, body) {
  const response = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { Authorization: `Bearer ${token}`, "content-type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.message || `HTTP ${response.status}`);
  return data;
}

function showLicense(state, message, isError = false) {
  const relevant = ["none", "trial", "expired", "invalid"].includes(state.state);
  // a running trial can be put away; the other states stay until there is a license
  if (!relevant || (state.state === "trial" && licenseDismissed && !message)) { $("licensePanel").hidden = true; return; }
  $("licensePanel").hidden = false;
  const buy = state.allowed ? "" : ` Buy a license: ${state.purchase_url}`;
  $("licenseText").textContent = message || (state.message + buy);
  $("licenseText").classList.toggle("err", isError);
  $("licenseTrial").hidden = state.state !== "none";
  $("licenseLater").hidden = state.state !== "trial";
}

async function checkLicense(asked = false) {
  if (!token) return;
  try {
    const state = await licenseRequest("/license");
    if (asked) licenseDismissed = false;
    showLicense(state);
  } catch (_) {
    // the API is not reachable: the status line says so
  }
}

function openLicenseEntry() {
  $("licenseEntry").hidden = false;
  licenseMode = inDevice;
  $("licenseInput").hidden = inDevice;
  $("licenseSave").hidden = inDevice;
  if (!inDevice) $("licenseInput").focus();
}

async function activateLicense(raw) {
  const key = String(raw || "").trim();
  if (!key) return;
  $("licenseText").textContent = "Activating…";
  try {
    const state = await licenseRequest("/license/activate", { key });
    $("licenseEntry").hidden = true;
    $("licenseInput").value = "";
    showLicense(state);
    add("note", state.message + ".");
  } catch (error) {
    licenseMode = inDevice;  // let the user try again
    $("licenseText").textContent = error.message;
    $("licenseText").classList.add("err");
  }
}

$("licenseTrial").onclick = async () => {
  $("licenseText").textContent = "Starting the trial…";
  try { showLicense(await licenseRequest("/license/trial", {})); } catch (error) { showLicense({ state: "none" }, error.message, true); }
};
$("licenseEnter").onclick = openLicenseEntry;
$("licenseSave").onclick = () => activateLicense($("licenseInput").value);
$("licenseInput").onkeydown = (event) => { if (event.key === "Enter") activateLicense($("licenseInput").value); };
$("licenseLater").onclick = () => { licenseDismissed = true; $("licensePanel").hidden = true; };

connect();
loadModels();
checkUpdate();
checkLicense();
setInterval(checkUpdate, UPDATE_POLL_MS);
</script>
