<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MidiBakery Sounds</title>
<style>
  :root {
    --bg: #19191b; --panel: #232427; --raise: #2c2d31; --line: #36373c; --text: #e6e6e8; --dim: #8b8c93;
    --accent: #ffad56; --accent-ink: #1a1206; --accent-soft: rgba(255, 173, 86, .14); --err: #ff7a7a; --r: 8px;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  main { max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: var(--dim); }
  button, input { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); transition: background .12s, border-color .12s; }
  button { padding: 6px 14px; cursor: pointer; }
  button:hover { background: var(--raise); border-color: #4a4b52; }
  input { padding: 8px 12px; width: 100%; }
  input:focus { outline: none; border-color: var(--accent); }
  .seg { display: flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 20px; }
  .seg button { flex: 1; border: 0; background: transparent; border-radius: 6px; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .part { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .part.open { border-color: var(--accent); }
  .head { display: flex; align-items: center; gap: 12px; }
  .head .name { width: 80px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; font-size: 12px; }
  .head .preset { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .head .preset.default { color: var(--dim); font-weight: 400; }
  .picker { margin-top: 12px; }
  .list { margin-top: 8px; max-height: 320px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--r); }
  .item { display: flex; gap: 10px; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: var(--raise); }
  .item .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .m { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .item.now .m { color: var(--accent); }
  #status { color: var(--dim); min-height: 20px; margin-top: 8px; }
  #status.err { color: var(--err); }
</style>
</head>
<body>
<main>
  <h1>Sounds</h1>
  <p class="lead">The preset new tracks get, per genre and part. Audition presets in Live's browser; here you pick by name. A genre's own choice wins over "All genres".</p>
  <div class="seg" id="genres"></div>
  <div id="parts"></div>
  <div id="status"></div>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.hash.slice(1)).get("token");
const GENRES = { "": "All genres", house: "House", melodic_techno: "Melodic", peak_time_techno: "Peak-Time", drum_and_bass: "D&B", trap: "Trap" };
const PARTS = { drums: "Drums", bass: "Bass", chords: "Chords", lead: "Lead" };
let genre = "", mine = {}, openPart = null, typing = null;

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { Authorization: `Bearer ${token}`, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || data.error || `HTTP ${res.status}`);
  return data;
}

function say(text, err) { $("status").textContent = text; $("status").className = err ? "err" : ""; }
const presetName = (path) => path.split("/").pop().replace(/\.[^.]*$/, "");

async function load() {
  try { mine = (await api(`/sounds?genre=${encodeURIComponent(genre)}&view=1`)).mine; say(""); }
  catch (err) { say(`Not connected: ${err.message}`, true); }
  render();
}

function renderGenres() {
  $("genres").textContent = "";
  for (const [value, label] of Object.entries(GENRES)) {
    const b = document.createElement("button");
    b.textContent = label;
    b.className = value === genre ? "on" : "";
    b.onclick = () => { genre = value; openPart = null; load(); };
    $("genres").append(b);
  }
}

function render() {
  renderGenres();
  const holder = $("parts");
  holder.textContent = "";
  for (const [part, label] of Object.entries(PARTS)) {
    const card = document.createElement("div");
    card.className = "part" + (openPart === part ? " open" : "");
    const head = document.createElement("div");
    head.className = "head";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = label;
    const preset = document.createElement("span");
    preset.className = "preset" + (mine[part] ? "" : " default");
    preset.textContent = mine[part] ? presetName(mine[part]) : "Genre default";
    preset.title = mine[part] || "";
    const change = document.createElement("button");
    change.textContent = openPart === part ? "Close" : "Change";
    change.onclick = () => { openPart = openPart === part ? null : part; render(); if (openPart) search(part, ""); };
    head.append(name, preset, change);
    card.append(head);
    if (openPart === part) {
      const box = document.createElement("div");
      box.className = "picker";
      const input = document.createElement("input");
      input.placeholder = "Search Live's browser, e.g. keys, reese, 909";
      input.oninput = () => { clearTimeout(typing); typing = setTimeout(() => search(part, input.value), 350); };
      const list = document.createElement("div");
      list.className = "list";
      list.id = "list";
      box.append(input, list);
      card.append(box);
      setTimeout(() => input.focus(), 0);
    }
    holder.append(card);
  }
}

async function search(part, query) {
  const list = $("list");
  if (!list) return;
  list.textContent = "";
  say("Looking in Live's browser...");
  const add = (name, meta, path) => {
    const row = document.createElement("div");
    row.className = "item" + (meta === "now" ? " now" : "");
    row.innerHTML = '<span class="n"></span><span class="m"></span>';
    row.firstChild.textContent = name;
    row.lastChild.textContent = meta;
    row.onclick = () => choose(part, path);
    list.append(row);
  };
  add("The genre's preset", mine[part] ? "" : "now", null);
  try {
    const { presets } = await api(`/sounds/presets?part=${part}&q=${encodeURIComponent(query)}`);
    if (openPart !== part) return;
    for (const p of presets) add(p.name, p.path === mine[part] ? "now" : p.path.split("/").slice(0, -1).join(" / "), p.path);
    say(presets.length ? "" : "Nothing found in Live's browser.");
  } catch (err) { say(err.message, true); }
}

async function choose(part, path) {
  try {
    await api("/sounds", { part, path, genre: genre || null });
    openPart = null;
    await load();
    say(path ? `${PARTS[part]}: ${presetName(path)}` : `${PARTS[part]}: the genre's preset`);
  } catch (err) { say(err.message, true); }
}

if (token) load(); else { render(); say("No token: open this page from the Bake device.", true); }
</script>
</body>
</html>
