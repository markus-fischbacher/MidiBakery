[project]
name = "midibakery"
version = "0.1.0"
description = "AI composition and session control for Ableton Live 12"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "Klirrwerk" }]
dependencies = [
    "anthropic>=1",
    "httpx2>=2.13.1",
    "mcp>=2.3",
    "pydantic>=2.14",
    "starlette>=1.8.0",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
midibakery = "midibakery.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midibakery"]
